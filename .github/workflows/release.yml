name: Release

# Человекочитаемые вехи: тег vX.Y.Z → GitHub Release (заметки из PR) + образ с тегом
# версии в GHCR. Непрерывный деплой идёт по push в main (см. ci.yml, job deploy);
# теги — для отслеживания «что за версия», отката и changelog.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute image ref
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # buildx с драйвером docker-container — как в обоих сборках ci.yml. Без него
      # тегированный релиз собирался дефолтным драйвером и с холодного кэша, то
      # есть ДРУГИМ путём, чем `:latest`/`:sha-`, из которых делается откат.
      # Разный билд-путь для одного Dockerfile — источник расхождений, которые
      # обнаруживаются только при откате, когда чинить уже некогда.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
