name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: novapost
          POSTGRES_PASSWORD: novapost
          POSTGRES_DB: novapostbot_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U novapost -d novapostbot_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://novapost:novapost@localhost:5432/novapostbot_test
      DATABASE_URL_DIRECT: postgresql+asyncpg://novapost:novapost@localhost:5432/novapostbot_test
      FERNET_KEY: 8LriREApni0MjqknuIDohQH6rnNVIOknKJ6Kl4tuVQ4=
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Layer boundary (no aiogram in services/db)
        run: |
          if grep -rnE "^(import aiogram|from aiogram)" app/services app/db; then
            echo "::error::app/services и app/db не должны импортировать aiogram (API-first слой)"
            exit 1
          fi

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Compileall
        run: python -m compileall -q app tests scripts

      - name: Pytest
        run: python -m pytest -q

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: novapost
          POSTGRES_PASSWORD: novapost
          POSTGRES_DB: novapostbot_migrations_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U novapost -d novapostbot_migrations_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://novapost:novapost@localhost:5432/novapostbot_migrations_test
      DATABASE_URL_DIRECT: postgresql+asyncpg://novapost:novapost@localhost:5432/novapostbot_migrations_test
      FERNET_KEY: 8LriREApni0MjqknuIDohQH6rnNVIOknKJ6Kl4tuVQ4=
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Alembic upgrade from empty database
        run: python -m alembic upgrade head

      # Пустая база не ловит бэкофиллы: осиротевших строк в ней нет по определению.
      # Прогоняем ещё раз поверх легаси-данных — бывший клиент, повышенный до
      # внутренней роли, но с оставшимися от него строками. Именно на таком входе
      # бэкофилл account_id ронял прод-деплой (NOT NULL abort всей транзакции).
      - name: Alembic upgrade over legacy data
        env:
          PGPASSWORD: novapost
        run: |
          set -euo pipefail
          psql -h localhost -U novapost -d novapostbot_migrations_test -v ON_ERROR_STOP=1 \
            -c "drop schema public cascade; create schema public;"
          python -m alembic upgrade a1b2c3d4e5f6
          psql -h localhost -U novapost -d novapostbot_migrations_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into users (id, telegram_id, phone, full_name, role, status, permissions, created_at, updated_at)
          values ('11111111-1111-1111-1111-111111111111', 999001, '380670000001', 'Був клієнт',
                  'manager', 'active', '{}', now(), now());
          insert into sender_profiles (id, client_id, name, np_api_key, org_type, is_default, created_at, updated_at)
          values ('22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111',
                  'ФОП', 'enc', 'fop', true, now(), now());
          SQL
          python -m alembic upgrade head
          psql -h localhost -U novapost -d novapostbot_migrations_test -v ON_ERROR_STOP=1 \
            -c "do \$\$ begin if (select count(*) from sender_profiles where account_id is null) > 0
                then raise exception 'backfill left orphaned account_id rows'; end if; end \$\$;"

  # Сборка образа на PR — БЕЗ публикации. До этого джоба `docker build` жил только
  # в `deploy`, то есть выполнялся впервые уже после мержа в main: отсутствие колёс
  # под новый Python, съехавший базовый образ или сломанный requirements.txt
  # проходили зелёный PR и обнаруживались на боевом деплое. Здесь собираем ровно то
  # же и теми же build-args, но `push: false` — GHCR не трогаем.
  image-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: novapostbot:pr
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Успешная сборка не значит «приложение стартует»: pip мог поставить всё, а
      # импорт — упасть на несовместимости. Поэтому дополнительно импортируем точки
      # входа внутри собранного образа.
      - name: Import smoke inside the image
        run: |
          docker run --rm novapostbot:pr python -c "
          import app.main, app.worker, app.bot.dispatcher
          print('entrypoints import: ok')
          "
          docker run --rm novapostbot:pr alembic --version

  # CD: только при push в main и после зелёных lint/test и migration-smoke.
  # Образ всегда публикуется в GHCR (git sha + latest); деплой по SSH — лишь если
  # заданы секреты сервера (иначе шаг мягко скипается, первый merge не падает).
  deploy:
    needs: [lint-test, migration-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Compute image ref
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # buildx с драйвером docker-container — иначе GHA-кэш (cache-to: type=gha) не
      # поддерживается дефолтным docker-драйвером.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Compose едет вместе с кодом. Раньше прод работал по своей копии
      # docker-compose.yml на сервере: инфраструктурные правки в репозитории
      # (бамп образов PG/Redis, новые сервисы, healthcheck) на прод не доезжали и
      # молча расходились. Кладём в staging-каталог, а НЕ поверх рабочего файла:
      # подмену с бэкапом и валидацией делает SSH-шаг ниже, поэтому оборвавшийся
      # scp не оставляет сервер с полуприменённым compose.
      - name: Upload compose file
        if: ${{ env.SSH_HOST != '' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || '~/NovaPostBot' }}/.deploy-incoming
          overwrite: true

      - name: Deploy over SSH
        if: ${{ env.SSH_HOST != '' }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          # APP_IMAGE (ghcr…:latest) задан в .env на сервере; порядок migrate→bot→worker
          # держит depends_on. --no-build: используем подтянутый образ, не собираем на VPS.
          script: |
            set -eu
            cd ${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || '~/NovaPostBot' }}

            # Образ, на котором прод работает ПРЯМО СЕЙЧАС, — по id, а не по тегу.
            # APP_IMAGE на сервере закреплён за `:latest`, и после `pull` этот тег
            # уже указывает на новый образ: откат только по compose вернул бы старый
            # конфиг с новым кодом. Id остаётся валидным, пока образ не удалён
            # (`image prune` запускаем лишь на успешном пути).
            PREV_IMAGE=""
            prev_cid=$(docker compose ps -q bot 2>/dev/null || true)
            if [ -n "$prev_cid" ]; then
              PREV_IMAGE=$(docker inspect -f '{{.Image}}' "$prev_cid" 2>/dev/null || true)
            fi
            echo "Текущий образ бота: ${PREV_IMAGE:-неизвестен}"

            # Подменяем compose на репозиторный, сохраняя откат. Валидируем ДО
            # pull/up: битый или несовместимый файл не должен уронить живой прод.
            restore_compose() {
              if [ -f docker-compose.yml.bak ]; then
                echo "Откат на предыдущий docker-compose.yml"
                mv -f docker-compose.yml.bak docker-compose.yml
              fi
              if [ -n "$PREV_IMAGE" ]; then
                echo "Откат на предыдущий образ $PREV_IMAGE"
                APP_IMAGE="$PREV_IMAGE" docker compose up -d --no-build || true
              else
                docker compose up -d --no-build || true
              fi
            }
            fail() {
              docker compose ps || true
              docker compose logs --no-color --tail=200 migrate bot worker || true
              restore_compose
              exit 1
            }

            if [ -f .deploy-incoming/docker-compose.yml ]; then
              # Не `[ -f … ] && cp` — под `set -e` ложное условие уронило бы скрипт
              # на сервере, где compose ещё не лежит (первый деплой).
              if [ -f docker-compose.yml ]; then
                cp docker-compose.yml docker-compose.yml.bak
              fi
              mv -f .deploy-incoming/docker-compose.yml docker-compose.yml
              if ! docker compose config -q; then
                echo "Репозиторный docker-compose.yml не валиден на этом сервере"
                fail
              fi
            fi

            docker compose pull || fail
            docker compose up -d --no-build || fail
            docker compose ps --status running --services | grep -Eq '(^| )bot( |$)' || fail
            docker compose ps --status running --services | grep -Eq '(^| )worker( |$)' || fail

            docker compose ps
            docker image prune -f
