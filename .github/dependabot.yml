version: 2
updates:
  # Python-зависимости. Источник — requirements*.in, ставится скомпилированный
  # лок requirements*.txt (см. CONTRIBUTING.md). Dependabot умеет и то, и другое:
  # поднимает границу в .in и перекомпилирует лок в том же PR. Если у него не
  # выйдет — CI-шаг «Requirements lock is in sync» это поймает.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore

  # Версии GitHub Actions в workflow'ах
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: chore
