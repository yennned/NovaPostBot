repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Держим в паре с ruff из requirements-dev (CI ставит свежий): старый пин
    # форматировал иначе и ломал `ruff format --check` в CI.
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
