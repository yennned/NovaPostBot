# Прод-Postgres — внешний (managed Neon, см. DATABASE_URL). Локальный `postgres`
# ниже (профиль `dev`) — для autogenerate миграций и прогона тестов без Neon.

# Общий образ для migrate/bot/worker (один Dockerfile, разные command).
# Локально APP_IMAGE не задан → `build` собирает novapostbot:local (как раньше).
# На проде в .env: APP_IMAGE=ghcr.io/yennned/novapostbot:latest → `docker compose pull`.
x-app: &app
  image: ${APP_IMAGE:-novapostbot:local}
  build: .
  env_file: .env

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Персистентность включена вместе с переездом FSM в Redis: без неё
    # незавершённые формы ТТН переживают редеплой бота (основной сценарий),
    # но не рестарт самого Redis — то есть переезд был бы наполовину
    # бутафорией. AOF с посекундным fsync: терять секунду ввода при падении
    # хоста приемлемо, четырнадцать экранов формы — нет.
    command: ["redis-server", "--save", "60 1", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  postgres:
    # Мажор держим в одном месте — `EXPECTED_PG_MAJOR` в app/db/base.py: бот на
    # старте логирует фактическую версию БД и кричит, если прод-Neon от неё уехал.
    # Меняете образ — меняйте и константу (и ci.yml).
    image: postgres:18-alpine
    profiles: ["dev"]
    environment:
      POSTGRES_USER: novapost
      POSTGRES_PASSWORD: novapost
      POSTGRES_DB: novapostbot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novapost -d novapostbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  bot:
    <<: *app
    command: ["python", "-m", "app.main"]
    # secrets/ не входит в образ (.dockerignore) — Google SA JSON пробрасываем
    # read-only. На проде тот же путь, что в локальном override (см. .env GOOGLE_SA_JSON).
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Пульс из event loop бота (app/utils/heartbeat.py). Проверка «процесс жив»
    # была бы бесполезна: она истинна всегда, пока контейнер запущен, а падение
    # и так лечит restart. Ловим другое — залипший поллинг при живом процессе.
    # ВАЖНО: compose сам по нездоровью НЕ перезапускает (это умеет только Swarm);
    # это видимость в `docker ps` и повод для деплоя дождаться healthy.
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Потолки, а не резервации: `reservations` compose вне swarm игнорирует.
    # Смысл — не «нарезать поровну», а не дать одному контейнеру утянуть за собой
    # весь VPS (CPX21: 3 vCPU / 4 ГБ на bot + worker + redis). Запас к типичному
    # потреблению (~200–300 МБ RSS) трёх-четырёхкратный: лимит должен ловить
    # утечку, а не штатный всплеск.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

volumes:
  redisdata:
